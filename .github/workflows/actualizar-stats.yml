name: Actualizar Transfermarkt Stats

on:
  schedule:
    # Se ejecuta todos los lunes a las 03:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar datos en GitHub (Commit)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add stats.json
          git commit -m "🤖 Stats de Transfermarkt actualizadas automáticamente" || echo "Sin cambios nuevos"
          git push
